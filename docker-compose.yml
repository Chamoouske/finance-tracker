services:
  db:
    image: postgres:16-alpine
    container_name: finance-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance_pass
      POSTGRES_DB: finance_tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance-tracker-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://finance:finance_pass@db:5432/finance_tracker?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finance-tracker-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - traefik
      - frontend
    labels:
      - "traefik.sidecar.enable=true"
      - "traefik.sidecar.cross-node=true"
      - "traefik.sidecar.router.rule=Host(`finance.home.lab`)"
      - "traefik.sidecar.router.entrypoints=websecure"
      - "traefik.sidecar.service.port=80"

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: finance-tracker-mcp
    restart: unless-stopped
    environment:
      PORT: "3001"
      GO_API_URL: "http://backend:8080"
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - frontend
      - traefik
    labels:
      - "traefik.sidecar.enable=true"
      - "traefik.sidecar.cross-node=true"
      - "traefik.sidecar.router.rule=Host(`finance-mcp.home.lab`)"
      - "traefik.sidecar.router.entrypoints=websecure"
      - "traefik.sidecar.service.port=3001"

volumes:
  pgdata:
    name: finance-tracker-pgdata

networks:
  backend:
  frontend:
  traefik:
    name: ${external-network}
    external: true
